# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main application route
    location / {
        try_files $uri $uri/ /index.html;
    }
    #Email request
    location ~ ^/ticketing/sendgrid/webhook/inbound {
            resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
            resolver_timeout 10s;

            set $backend_upstream ${BACKEND_HOST};
            proxy_pass $backend_upstream$request_uri;  # Added $request_uri here

            # Standard headers
            proxy_set_header Host ${BACKEND_HOSTNAME};  # Changed to use BACKEND_HOSTNAME for consistency
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # SSL settings (if needed for backend communication)
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Timeouts for HTTP redirect response
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Allow redirects to be followed
            proxy_redirect off;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries 2;
        }

    # Account verification route - direct proxy to Spring Boot app
    location ~ ^/ticketing/account/verify/(.+)$ {
        resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 10s;

        set $backend_upstream ${BACKEND_HOST};
        proxy_pass $backend_upstream$request_uri;  # Added $request_uri here

        # Standard headers
        proxy_set_header Host ${BACKEND_HOSTNAME};  # Changed to use BACKEND_HOSTNAME for consistency
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # SSL settings (if needed for backend communication)
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Timeouts for HTTP redirect response
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Allow redirects to be followed
        proxy_redirect off;

        # Error handling
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 30s;
        proxy_next_upstream_tries 2;
    }

    location /backend/ {
        resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 10s;

        set $backend_upstream ${BACKEND_HOST};
        rewrite ^/backend(/.*)$ $1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        # Standard headers for all requests
        proxy_set_header Host ${BACKEND_HOSTNAME};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket upgrade headers (automatically used when needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket specific headers (only sent when upgrade header present)
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        # SSL settings for Azure WebApps
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Dynamic timeouts based on connection type
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;  # 24 hours (WebSocket friendly)
        proxy_send_timeout 86400s;  # 24 hours (WebSocket friendly)

        # Buffering settings
        proxy_buffering on;           # Enabled for regular HTTP requests
        proxy_buffers 8 32k;         # Used for API responses
        proxy_buffer_size 64k;       # Used for API responses
        proxy_busy_buffers_size 128k;

        # WebSocket specific settings (applied automatically when upgraded)
        proxy_cache off;             # Always off for real-time data
        proxy_request_buffering off; # Allows streaming requests

        # Error handling
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 60s;
        proxy_next_upstream_tries 2;
    }

    # Chat service (separate from backend)
    location /chat {
        resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 10s;

        set $chat_upstream ${CHAT_HOST};
        proxy_pass $chat_upstream$request_uri;

        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard headers
        proxy_set_header Host ${CHAT_HOSTNAME};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific headers
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        # SSL settings
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Long timeouts for chat
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # No buffering for chat
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
    }

    # Alternative chat route with trailing slash
    location /chat/ {
        resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 10s;

        set $chat_upstream ${CHAT_HOST};
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass $chat_upstream;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host ${CHAT_HOSTNAME};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        add_header Vary "Accept-Encoding";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "Backend: API + WebSocket, Chat: WebSocket\n";
        add_header Content-Type text/plain;
    }

    # Debug endpoint to check proxy configuration
    location /debug-headers {
        access_log off;
        return 200 "Upgrade: $http_upgrade\nConnection: $connection_upgrade\nHost: $http_host\n";
        add_header Content-Type text/plain;
    }

    server_tokens off;
}
